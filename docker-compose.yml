name: documind

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: documind-postgres
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind_dev_only
    ports:
      - "5432:5432"
    volumes:
      - documind_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: documind-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: ./services/ai-service
    container_name: documind-ai-service
    environment:
      PORT: 8080
      SERVICE_NAME: ai-service
      LOG_LEVEL: INFO
      # mock is the default on purpose: the service must start, serve every
      # endpoint and pass its tests with no OCI credential and no network.
      # See services/ai-service/README.md and ADR-006.
      AI_BACKEND: mock
      MODEL_NAME: mock-chat-v1
      EMBEDDING_MODEL: mock-embed-v1
      # Must match the vector(N) column in database/schema.sql.
      EMBEDDING_DIM: 384
      TEMPERATURE: "0.0"
      MAX_TOKENS: 1024
      REQUEST_TIMEOUT_S: "30"
      MAX_RETRIES: 3
      TOKEN_BUDGET_PER_REQUEST: 8000
      MAX_EMBED_BATCH: 96
      PROMPTS_DIR: app/prompts
    ports:
      - "8081:8080"
    healthcheck:
      # Uses the readiness probe, so compose agrees with Kubernetes about what
      # "up" means for this service.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/readiness', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  search-service:
    build:
      context: ./services/search-service
    container_name: documind-search-service
    environment:
      PORT: 8080
      EMBEDDING_BACKEND: mock
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      EMBEDDING_DIM: 384
      VECTOR_STORE_BACKEND: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: documind
      DB_USER: documind
      DB_PASSWORD: documind_dev_only
      DISABLE_AUTH: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  documind_pgdata:
