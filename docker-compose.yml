name: documind

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: documind-postgres
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind_dev_only
    ports:
      - "5432:5432"
    volumes:
      - documind_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Runs between schema and seed: it adds tables that reference documents.
      - ./database/migrations/002_processing_jobs.sql:/docker-entrypoint-initdb.d/02-processing.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: documind-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: ./services/ai-service
    container_name: documind-ai-service
    # Provider configuration comes from services/ai-service/.env, which is
    # gitignored and holds the API key. The same file is read by `uvicorn` when
    # running the service directly, so local and compose behave identically.
    #
    # With no .env present the service falls back to its own defaults, which are
    # AI_BACKEND=mock - it starts and serves every endpoint offline with no
    # credential. See services/ai-service/.env.example for the shape.
    env_file:
      - path: ./services/ai-service/.env
        required: false
    environment:
      # Fixed by the container layout. Deliberately NOT duplicating anything
      # .env sets: compose's `environment` overrides `env_file`, so a default
      # here would make the .env value unreachable.
      PORT: 8080
      SERVICE_NAME: ai-service
      LOG_LEVEL: INFO
      PROMPTS_DIR: app/prompts
    ports:
      # 8082, not 8081: document-service below owns 8081, and the frontend's
      # DOCUMENT_SERVICE_URL defaults to it.
      - "8082:8080"
    healthcheck:
      # Uses the readiness probe, so compose agrees with Kubernetes about what
      # "up" means for this service.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/readiness', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  document-service:
    build:
      context: ./services/document-service
    container_name: documind-document-service
    environment:
      PORT: 8080
      SERVICE_NAME: document-service
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://documind:documind_dev_only@postgres:5432/documind
      REDIS_URL: redis://redis:6379/0
      STORAGE_TYPE: local
      STORAGE_DIR: /app/storage
    ports:
      - "8081:8080"
    volumes:
      - documind_docstorage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/readiness', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  processing-service:
    build:
      context: ./services/processing-service
    container_name: documind-processing-service
    environment:
      PORT: 8080
      SERVICE_NAME: processing-service
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://documind:documind_dev_only@postgres:5432/documind
      REDIS_URL: redis://redis:6379/0
      # Must match document-service's REDIS_STREAM_NAME, which defaults to the
      # same value — the producer and consumer agree on the stream by name and
      # nothing else.
      REDIS_STREAM_NAME: document_jobs
      REDIS_CONSUMER_GROUP: processing-workers
      # Reads the same volume document-service writes to. On OKE this becomes
      # STORAGE_TYPE=oci, because a block volume cannot be mounted by more than
      # one pod.
      STORAGE_TYPE: local
      STORAGE_DIR: /app/storage
      AI_SERVICE_URL: http://ai-service:8080
      SEARCH_SERVICE_URL: http://search-service:8080
      # No SEARCH_SERVICE_AUTH_TOKEN: search-service runs with DISABLE_AUTH=true
      # here, and the client sends no Authorization header when the token is
      # empty. In the cluster the token comes from a Kubernetes Secret.
    volumes:
      # Read-only: this service consumes documents, it never writes them.
      - documind_docstorage:/app/storage:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not just for ordering: a fresh named volume is seeded from whichever
      # container mounts it first, so document-service must go first or the
      # volume ends up owned by a uid that cannot write the uploads.
      document-service:
        condition: service_healthy
    healthcheck:
      # /liveness here means "the consumer task is still running", not merely
      # "the HTTP server responds" — see app/routes/health.py.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/liveness', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  search-service:
    build:
      context: ./services/search-service
    container_name: documind-search-service
    environment:
      PORT: 8080
      EMBEDDING_BACKEND: mock
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      EMBEDDING_DIM: 384
      VECTOR_STORE_BACKEND: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: documind
      DB_USER: documind
      DB_PASSWORD: documind_dev_only
      DISABLE_AUTH: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: documind-api-gateway
    environment:
      PORT: 8000
      SERVICE_NAME: api-gateway
      LOG_LEVEL: INFO
      JWT_SECRET: dev-secret-change-me
      # Downstream URLs use Docker service names + their internal port (8080).
      SEARCH_SERVICE_URL: http://search-service:8080
      DOCUMENT_SERVICE_URL: http://document-service:8080
      AI_SERVICE_URL: http://ai-service:8080
    ports:
      - "8000:8000"
    depends_on:
      search-service:
        condition: service_started
      document-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readiness', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  documind_pgdata:
  documind_docstorage:
