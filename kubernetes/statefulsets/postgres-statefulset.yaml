# TEMPORARY in-cluster PostgreSQL -- see postgres-init-scripts-configmap.yaml
# header for why this exists instead of the intended OCI-managed instance.
# Single replica, no clustering/replication: proportionate to a demo burst,
# not a production HA requirement.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: documind
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: documind
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: documind
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Fully qualified: this OKE node's CRI-O runs with
          # short-name-mode=enforcing, which rejects an unqualified name
          # like "pgvector/pgvector:pg16" as ambiguous across configured
          # search registries -- confirmed via a real pull failure.
          image: docker.io/pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: "documind"
            - name: POSTGRES_USER
              value: "documind"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "documind", "-d", "documind"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "documind", "-d", "documind"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: documind
      spec:
        storageClassName: oci-bv-paravirtualized
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
