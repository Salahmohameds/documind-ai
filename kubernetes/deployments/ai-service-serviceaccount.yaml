# Service account for ai-service.
#
# Same OKE Workload Identity binding as processing-service/document-service:
# the dm-demo-dg-workloads dynamic group matches any pod in
# shared-group-b-cmp on an ENHANCED_CLUSTER, granting `use
# generative-ai-family` and `read secret-family` with no credential mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-service
  namespace: documind
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: documind
automountServiceAccountToken: false
