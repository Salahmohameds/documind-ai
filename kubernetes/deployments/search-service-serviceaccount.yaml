# Service account for search-service.
#
# search-service reads/writes only Postgres/pgvector and calls ai-service
# over HTTP -- it touches no OCI API directly, so it needs no dynamic-group
# binding. It exists so the Deployment has an explicit, minimal-privilege
# identity instead of running as `default`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-service
  namespace: documind
  labels:
    app.kubernetes.io/name: search-service
    app.kubernetes.io/part-of: documind
automountServiceAccountToken: false
