# Service account for api-gateway.
#
# api-gateway calls no OCI service directly today (it only proxies to the
# other in-cluster services), so this account needs no workload-identity
# binding to a dynamic group -- it exists so the Deployment has an explicit,
# minimal-privilege identity instead of running as `default`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: documind
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: documind
automountServiceAccountToken: false
