# Service account for processing-service.
#
# The identity half of "no hardcoded secrets": OKE Workload Identity (on the
# ENHANCED_CLUSTER this project requires — see terraform/environments/demo)
# matches this pod against the dm-demo-dg-workloads dynamic group using the
# rule `resource.type='pod', resource.compartment.id=<shared-group-b-cmp>`
# (terraform/modules/iam/main.tf), so the pod authenticates to Object
# Storage/GenAI/Vault with no credential mounted, stored, or rotated
# anywhere. This project's matching rule is compartment-scoped, not
# ServiceAccount-scoped, so no oci.oraclecloud.com/* annotation is required
# here — but this has not yet been verified end-to-end against a live OKE
# Enhanced Cluster. Before relying on this in the real demo, confirm against
# current Oracle OKE Workload Identity documentation whether this cluster's
# OKE version also expects an explicit ServiceAccount annotation, and add one
# if so.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: processing-service
  namespace: documind
  labels:
    app.kubernetes.io/name: processing-service
    app.kubernetes.io/part-of: documind
# The worker calls no Kubernetes API, so it has no use for a mounted token —
# and a token it does not need is only an attack surface.
automountServiceAccountToken: false
