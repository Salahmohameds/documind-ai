# Service account for processing-service.
#
# The identity half of "no hardcoded secrets": this account is bound to an OCI
# IAM dynamic group whose policy allows reading the documents bucket, so the
# pod authenticates to Object Storage with no credential mounted, stored or
# rotated anywhere. Created by the Terraform iam module (role 2), which fills
# in the annotation below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: processing-service
  namespace: documind
  labels:
    app.kubernetes.io/name: processing-service
    app.kubernetes.io/part-of: documind
# The worker calls no Kubernetes API, so it has no use for a mounted token —
# and a token it does not need is only an attack surface.
automountServiceAccountToken: false
