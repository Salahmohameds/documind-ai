# Service account for frontend. It calls no OCI service directly (only the
# other in-cluster services via its own /api/* route handlers), so it needs
# no workload-identity binding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: documind
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: documind
automountServiceAccountToken: false
