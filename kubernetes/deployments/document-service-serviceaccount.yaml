# Service account for document-service.
#
# Same OKE Workload Identity binding as processing-service (see that
# ServiceAccount's comment): the dm-demo-dg-workloads dynamic group matches
# any pod in shared-group-b-cmp on an ENHANCED_CLUSTER, so this account
# needs no separate annotation to read/write the documents and processed
# buckets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: document-service
  namespace: documind
  labels:
    app.kubernetes.io/name: document-service
    app.kubernetes.io/part-of: documind
automountServiceAccountToken: false
