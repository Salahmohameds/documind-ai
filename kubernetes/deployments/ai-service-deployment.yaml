# ai-service — OCI Generative AI / mock classification, extraction,
# summarization, risk analysis.
#
# IMAGE TAG: replace the placeholder below with an immutable tag (git SHA or
# vX.Y.Z) at deploy time. kubernetes/README.md: never ':latest'.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: documind
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: documind
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/part-of: documind
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ai-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-service
          image: REGION.ocir.io/NAMESPACE/documind/ai-service:REPLACE_WITH_GIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-service-config
            - secretRef:
                name: ai-service-secret
                optional: true
          resources:
            # Highest CPU/memory of the four backend services: PDF/text
            # analysis and (in "oci" mode) request/response buffering for
            # Generative AI calls are the heaviest work in the pipeline.
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Checks provider reachability + circuit-breaker state (cached) --
          # a broken GenAI endpoint takes this pod out of rotation instead of
          # returning 500s to processing-service.
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /liveness
              port: http
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
