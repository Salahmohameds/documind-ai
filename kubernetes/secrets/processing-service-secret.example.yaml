# TEMPLATE ONLY — never commit a filled-in copy of this file.
# CONTRIBUTING.md rule 1: only *.example files, real values via Vault/kubectl.
#
# Create the real Secret out of band, e.g.:
#
#   kubectl -n documind create secret generic processing-service-secret \
#     --from-literal=DATABASE_URL='postgresql://USER:PASSWORD@HOST:5432/documind' \
#     --from-literal=REDIS_URL='redis://:PASSWORD@HOST:6379/0' \
#     --from-literal=SEARCH_SERVICE_AUTH_TOKEN='<service token>'
#
# In the burst deployment these come from OCI Vault via the secrets-store CSI
# driver rather than being typed by hand.
apiVersion: v1
kind: Secret
metadata:
  name: processing-service-secret
  namespace: documind
  labels:
    app.kubernetes.io/name: processing-service
    app.kubernetes.io/part-of: documind
type: Opaque
stringData:
  # Carries the database password — that is why the URL is here rather than in
  # the ConfigMap alongside the other connection settings.
  DATABASE_URL: "postgresql://REPLACE_ME:REPLACE_ME@REPLACE_ME:5432/documind"
  REDIS_URL: "redis://:REPLACE_ME@REPLACE_ME:6379/0"
  # Bearer token for search-service's JWT middleware. Leave the key out
  # entirely to send no Authorization header (only valid where search-service
  # runs with DISABLE_AUTH=true).
  SEARCH_SERVICE_AUTH_TOKEN: "REPLACE_ME"
  # ai-service has no auth in v1; present so enabling it later is a value
  # change rather than a manifest change.
  AI_SERVICE_AUTH_TOKEN: ""
