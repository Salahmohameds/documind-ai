# what SEARCH_SERVICE_TOKEN should contain (e.g. a pre-signed service JWT)
# before relying on this in the real demo.
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secret
  namespace: documind
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: documind
type: Opaque
stringData:
  SEARCH_SERVICE_TOKEN: "REPLACE_ME"
