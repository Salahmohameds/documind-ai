#
#   kubectl -n documind create secret generic frontend-secret \
#     --from-literal=SEARCH_SERVICE_TOKEN='REPLACE_ME'
#
# NOTE: search-service's auth is JWT/HS256 gated by JWT_SECRET + DISABLE_AUTH
