# TEMPLATE ONLY — never commit a filled-in copy of this file.
# CONTRIBUTING.md rule 1: only *.example files, real values via Vault/kubectl.
#
#   kubectl -n documind create secret generic redis-secret \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -base64 24)"
#
# The same password must be embedded in document-service's and
# processing-service's REDIS_URL secret value
# (redis://:<REDIS_PASSWORD>@redis.documind.svc.cluster.local:6379/0).
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: documind
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: documind
type: Opaque
stringData:
  REDIS_PASSWORD: "REPLACE_ME"
