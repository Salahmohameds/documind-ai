# TEMPLATE ONLY — never commit a filled-in copy of this file.
# CONTRIBUTING.md rule 1: only *.example files, real values via Vault/kubectl.
#
# Create the real Secret out of band, e.g.:
#
#   kubectl -n documind create secret generic api-gateway-secret \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 32)"
#
# MUST be the exact same value as search-service's JWT_SECRET — both
# services validate the same HS256-signed tokens.
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: documind
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: documind
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
