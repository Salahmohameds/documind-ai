apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: documind
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: documind
data:
  PORT: "3000"
  NODE_ENV: "production"
  # In-cluster Service DNS names -- see frontend/documind/lib/server/backend.ts,
  # which now fails fast at startup in production if any of these is unset
  # rather than silently falling back to localhost.
  DOCUMENT_SERVICE_URL: "http://document-service.documind.svc.cluster.local:8080"
  SEARCH_SERVICE_URL: "http://search-service.documind.svc.cluster.local:8080"
  AI_SERVICE_URL: "http://ai-service.documind.svc.cluster.local:8080"
