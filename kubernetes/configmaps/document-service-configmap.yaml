apiVersion: v1
kind: ConfigMap
metadata:
  name: document-service-config
  namespace: documind
  labels:
    app.kubernetes.io/name: document-service
    app.kubernetes.io/part-of: documind
data:
  # --- Application ---------------------------------------------------------
  PORT: "8080"
  SERVICE_NAME: "document-service"
  LOG_LEVEL: "INFO"

  # --- Redis Streams (producer side) ----------------------------------------
  # Must match processing-service's REDIS_STREAM_NAME — same convention as
  # kubernetes/configmaps/processing-service-configmap.yaml.
  REDIS_STREAM_NAME: "document_jobs"

  # --- Storage ---------------------------------------------------------------
  # "local" (a block volume) is ReadWriteOnce and cannot be shared across
  # replicas or read by processing-service's pods -- must be OCI Object
  # Storage for anything beyond a single-replica local dev run. Requires the
  # image to be built with --build-arg INSTALL_OCI=true (see Dockerfile).
  STORAGE_TYPE: "oci_object_storage"
  OCI_BUCKET_NAME: "dm-demo-documents"
  # Authentication is OKE workload identity -- no credential mounted anywhere.
  OCI_AUTH_MODE: "workload"
  # Filled in by role 2 at deploy time from the Terraform outputs.
  OCI_NAMESPACE: ""
  OCI_REGION: ""

  # --- Upload limits -----------------------------------------------------
  MAX_UPLOAD_MB: "25"
