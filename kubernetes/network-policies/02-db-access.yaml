apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-postgres-access
  namespace: documind
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: document-service
    - podSelector:
        matchLabels:
          app: search-service
    ports:
    - protocol: TCP
      port: 5432
