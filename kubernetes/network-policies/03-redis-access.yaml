apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-redis-access
  namespace: documind
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: document-service 
    - podSelector:
        matchLabels:
          app: worker 
    ports:
    - protocol: TCP
      port: 6379
