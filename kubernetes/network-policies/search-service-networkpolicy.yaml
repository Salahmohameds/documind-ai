apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-service
  namespace: documind
  labels:
    app.kubernetes.io/name: search-service
    app.kubernetes.io/part-of: documind
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: search-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # api-gateway and processing-service both call search-service.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: processing-service
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # --- DNS -----------------------------------------------------------------
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # --- ai-service (embeddings) ---------------------------------------------
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-service
      ports:
        - protocol: TCP
          port: 8080

    # --- PostgreSQL --
    # PostgreSQL is TEMPORARILY in-cluster (see
    # kubernetes/statefulsets/postgres-statefulset.yaml header) because the
    # OCI-managed instance hit its dbsystem-count quota during the burst --
    # the podSelector rule below is what reaches it; the ipBlock rule below
    # that is kept as a fallback for once the managed instance is restored.
    # ---
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 5432

    # --- OTel collector ----------------------------------------------------
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4317
