# This wraps grafana/dashboard-observability.json into a ConfigMap so the
# Grafana Helm chart auto-loads it on startup (see dashboardsConfigMaps in
# kube-prometheus-stack-values.yaml).
#
# Regenerate this file any time you edit dashboard-observability.json:
#
#   kubectl create configmap grafana-dashboard-observability \
#     -n monitoring \
#     --from-file=dashboard-observability.json=../grafana/dashboard-observability.json \
#     --dry-run=client -o yaml > grafana-dashboard-configmap.yaml
#
# Then: kubectl apply -f grafana-dashboard-configmap.yaml


apiVersion: v1
data:
  dashboard-observability.json: |
    {
      "title": "Platform Observability",
      "uid": "platform-observability",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 100,
          "title": "Golden Signals",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 1,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15,
                "gradientMode": "opacity",
                "spanNulls": true,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max", "mean"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[5m])) by (job)",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Latency P95 / P99 (s)",
          "type": "timeseries",
          "description": "P95: 95% of requests finish faster than this line. P99: 99% do. P99 is always >= P95 — it's the tail, driven by your slowest 1-in-100 requests, so it's what users actually complain about even when the average looks fine.",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "gradientMode": "opacity",
                "spanNulls": true,
                "showPoints": "never"
              }
            },
            "overrides": [
              { "matcher": { "id": "byRegexp", "options": "p99.*" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }] },
              { "matcher": { "id": "byRegexp", "options": "p95.*" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } }] }
            ]
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_highr_seconds_bucket[5m])) by (le, job))",
              "legendFormat": "p95 - {{job}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_highr_seconds_bucket[5m])) by (le, job))",
              "legendFormat": "p99 - {{job}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Error Rate (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 25,
                "gradientMode": "scheme",
                "spanNulls": true,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "100 * sum(rate(http_requests_total{status=~\"5..\"}[5m])) by (job) / sum(rate(http_requests_total[5m])) by (job)",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 101,
          "title": "Resource Usage",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "panels": []
        },
        {
          "id": 4,
          "title": "CPU Usage by Pod (cores)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 15, "gradientMode": "opacity", "spanNulls": true, "showPoints": "never" }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace!=\"kube-system\", container!=\"\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Memory Usage by Pod (MB)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "unit": "mbytes",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 15, "gradientMode": "opacity", "spanNulls": true, "showPoints": "never" }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace!=\"kube-system\", container!=\"\"}) by (pod) / 1024 / 1024",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 12,
          "title": "Node CPU Usage (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 25, "gradientMode": "scheme", "spanNulls": true, "showPoints": "never" }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 13,
          "title": "Node Memory Usage (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 25, "gradientMode": "scheme", "spanNulls": true, "showPoints": "never" }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 102,
          "title": "Scaling & Reliability",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 },
          "panels": []
        },
        {
          "id": 6,
          "title": "Pod Restarts",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 19 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 60, "spanNulls": true, "showPoints": "never" }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["sum"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total[15m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Running Pods per Deployment",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 19 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 15, "gradientMode": "opacity", "spanNulls": true, "showPoints": "never" }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum(kube_deployment_status_replicas_available) by (deployment)",
              "legendFormat": "{{deployment}}"
            }
          ]
        },
        {
          "id": 8,
          "title": "HPA: Current vs Desired Replicas",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 19 },
          "description": "Requires metrics-server + a HorizontalPodAutoscaler object (see kubernetes/sample-service.yaml). Shows scaling in action during load tests.",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "spanNulls": true, "showPoints": "never" }
            },
            "overrides": [
              { "matcher": { "id": "byRegexp", "options": "current.*" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } }] },
              { "matcher": { "id": "byRegexp", "options": "desired.*" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "purple" } }] }
            ]
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas",
              "legendFormat": "current - {{horizontalpodautoscaler}}"
            },
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas",
              "legendFormat": "desired - {{horizontalpodautoscaler}}"
            }
          ]
        },
        {
          "id": 9,
          "title": "HPA: Target Metric (CPU %)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 19 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "red", "value": 80 }
                ]
              },
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 20, "gradientMode": "scheme", "spanNulls": true, "showPoints": "never" }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_metrics_average_utilization",
              "legendFormat": "{{horizontalpodautoscaler}}"
            }
          ]
        }
      ]
    }
kind: ConfigMap
metadata:
  name: grafana-dashboard-observability
  namespace: monitoring
