# Autoscaling for the public entry point — CPU-based, mirrors
# processing-service-hpa.yaml's shape. api-gateway is a thin proxy, so CPU
# tracks request volume reasonably well (unlike the worker, it has no
# I/O-bound queue-depth signal to prefer instead).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: documind
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: documind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
