# CI — DocuMind AI (skeleton: safe on empty dirs, gates as code lands)

name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read
  pull-requests: read

jobs:
  terraform-static:
    name: Terraform fmt / validate / tflint / checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Terraform files
        id: tf
        run: |
          if find terraform -name '*.tf' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform files yet — skipping."
          fi

      - uses: hashicorp/setup-terraform@v3
        if: steps.tf.outputs.found == 'true'

      - name: Terraform fmt
        if: steps.tf.outputs.found == 'true'
        run: terraform -chdir=terraform fmt -check -recursive

      - uses: terraform-linters/setup-tflint@v4
        if: steps.tf.outputs.found == 'true'

      - name: tflint
        if: steps.tf.outputs.found == 'true'
        run: tflint --recursive --chdir=terraform

      - name: checkov
        if: steps.tf.outputs.found == 'true'
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true # tighten to hard fail after baseline hardening (M4)

  services-build-scan:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover service images
        id: imgs
        run: |
          mapfile -t dirs < <(find services -maxdepth 2 -name Dockerfile -printf '%h\n' 2>/dev/null | sort)
          # frontend is a sibling top-level directory (not under services/),
          # added explicitly so a broken frontend Dockerfile fails CI too.
          if [ -f frontend/documind/Dockerfile ]; then
            dirs+=("frontend/documind")
          fi
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "none=true" >> "$GITHUB_OUTPUT"
            echo "No service Dockerfiles yet — skipping."
          else
            echo "none=false" >> "$GITHUB_OUTPUT"
            echo "list=${dirs[*]}" >> "$GITHUB_OUTPUT"
          fi

      - uses: aquasecurity/setup-trivy@v0.2.6
      # setup-trivy@v0.2.2 does not exist and failed every run — use the
      # official installer instead.
      - name: Install Trivy
        if: steps.imgs.outputs.none == 'false'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Build and scan each service image
        if: steps.imgs.outputs.none == 'false'
        run: |
          df -h /
          for d in ${{ steps.imgs.outputs.list }}; do
            img="documind/$(basename "$d"):ci"
            echo "::group::Building $d"
            docker build -t "$img" "$d"
            echo "::endgroup::"
            echo "::group::Trivy scan $d"
            trivy image --exit-code 0 --severity HIGH,CRITICAL "$img"
            # M4: switch to --exit-code 1 to hard-fail on HIGH/CRITICAL
            echo "::endgroup::"
            # runner has ~14GB; three service images no longer fit at once
            docker rmi -f "$img" || true
            docker builder prune -af || true
            df -h /
          done
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks reads PR commits; missing grant = 403
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover services with tests
        id: svc
        run: |
          mapfile -t dirs < <(find services -maxdepth 2 -type d -name tests -printf '%h\n' 2>/dev/null | sort)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "none=true" >> "$GITHUB_OUTPUT"
            echo "No service test suites yet — skipping."
          else
            echo "none=false" >> "$GITHUB_OUTPUT"
            echo "list=${dirs[*]}" >> "$GITHUB_OUTPUT"
          fi
      - name: Run pytest per service
        if: steps.svc.outputs.none == 'false'
        run: |
          failed=0
          for d in ${{ steps.svc.outputs.list }}; do
            echo "::group::pytest $d"
            python -m venv "/tmp/venv-$(basename "$d")"
            # shellcheck disable=SC1090
            source "/tmp/venv-$(basename "$d")/bin/activate"
            pip install --quiet --upgrade pip
            if [ -f "$d/requirements.txt" ]; then
              pip install --quiet -r "$d/requirements.txt"
            fi
            pip install --quiet pytest
            ( cd "$d" && python -m pytest tests -q ) || failed=1
            deactivate
            echo "::endgroup::"
          done
          exit "$failed"
